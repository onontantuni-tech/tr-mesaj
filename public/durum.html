<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TR — Sistem durumu</title><link rel="icon" href="/icons/icon-192.png">
<style>body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f5f5f5;color:#1a1a1a}header{background:#D7261E;color:#fff;padding:22px 16px;text-align:center}h1{margin:0;font-size:22px}
main{max-width:560px;margin:16px auto;padding:0 12px}.row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:14px;margin-bottom:8px;box-shadow:0 2px 8px rgba(0,0,0,.05)}.row b{flex:1}.dot{width:12px;height:12px;border-radius:50%;background:#bbb}.ok{background:#16a34a}.bad{background:#dc2626}small{color:#666}</style></head>
<body><header><h1>TR sistem durumu</h1><div id="sum">Kontrol ediliyor…</div></header><main id="list"></main>
<p style="text-align:center"><small id="at"></small> · <a href="/">Uygulamaya dön</a></p>
<script>
const checks=[["Uygulama","/sw.js",[200]],["Cüzdan ve oyun sunucusu","/api/wallet",[401,405]],["Okey / oyun masaları","/api/game",[401,405]],["Bildirim sunucusu","/api/notify",[401,405]],["Arama (TURN) sunucusu","/api/turn",[401,405]],["Giriş (Google)","/__/auth/handler",[200,302,400]]];
(async()=>{let bad=0;const L=document.getElementById("list");
 for(const [n,u,okc] of checks){const r=document.createElement("div");r.className="row";r.innerHTML=`<span class="dot"></span><b>${n}</b><small>…</small>`;L.appendChild(r);
  const t0=performance.now();let ok=false,code=0;try{const res=await fetch(u,{method:u.startsWith("/api/")?"POST":"GET",cache:"no-store"});code=res.status;ok=okc.includes(code)}catch(e){}
  r.querySelector(".dot").className="dot "+(ok?"ok":"bad");r.querySelector("small").textContent=ok?Math.round(performance.now()-t0)+" ms":"sorun var";if(!ok)bad++}
 document.getElementById("sum").textContent=bad?`${bad} serviste sorun var`:"Tüm sistemler çalışıyor ✓";document.getElementById("at").textContent=new Date().toLocaleString("tr-TR")})();
</script></body></html>
